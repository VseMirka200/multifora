name: Сборка EXE и установщика для Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Собрать приложение для Windows
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Установить зависимости для разработки и сборки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "PyInstaller>=6,<7"
      - name: Проверить стиль кода
        run: python -m ruff check .
      - name: Запустить тесты в Windows
        run: python -m pytest -q
      - name: Собрать портативную версию приложения
        shell: cmd
        run: scripts\build_app.bat --no-pause
      - name: Проверить собранный EXE и Ghostscript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'multifora-build-smoke.json'
          $env:MULTIFORA_SMOKE_REPORT = $report
          $app = Start-Process -FilePath '.\dist\Multifora\Multifora.exe' -ArgumentList '--build-smoke-test' -Wait -PassThru
          if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
          if ($app.ExitCode -ne 0) { throw "Frozen EXE failed: $($app.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok' -or -not $result.window_visible) { throw 'Main window did not initialize' }
          & '.\dist\Multifora\bin\gswin64\gswin64c.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Ghostscript did not start' }
      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Собрать установщик
        shell: cmd
        run: scripts\build_installer.bat --skip-app-build
      - name: Проверить установленное приложение
        shell: pwsh
        run: .\scripts\verify_installer.ps1
      - name: Создать ZIP-архив и контрольные суммы
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Опубликовать артефакты сборки
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Multifora-Windows-build
          path: |
            dist/installer/Multifora-Setup-*.exe
            dist/installer/Multifora-Silent-Install-*.bat
            dist/Multifora-Portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

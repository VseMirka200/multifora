name: Сборка EXE и установщика для Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Собрать приложение для Windows
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Установить зависимости для разработки и сборки
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python scripts/verify_build_environment.py
      - name: Проверить стиль кода
        run: python -m ruff check .
      - name: Запустить тесты в Windows
        run: python -m pytest -q
      - name: Собрать портативную версию приложения
        shell: cmd
        run: scripts\build_app.bat --no-pause
      - name: Проверить собранный EXE и Ghostscript
        shell: pwsh
        run: .\scripts\verify_windows_runtime.ps1
      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Собрать установщик
        shell: cmd
        run: scripts\build_installer.bat --skip-app-build
      - name: Проверить установленное приложение
        shell: pwsh
        run: .\scripts\verify_installer.ps1
      - name: Создать ZIP-архив и контрольные суммы
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Опубликовать артефакты сборки
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Multifora-Windows-build
          path: |
            dist/installer/Multifora-Setup-*.exe
            dist/installer/Multifora-Silent-Install-*.bat
            dist/Multifora-Portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

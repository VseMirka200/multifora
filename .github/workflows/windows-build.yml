name: Windows EXE and installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<10" "PyInstaller>=6,<7"
      - name: Run Windows tests
        run: python -m pytest -q
      - name: Build portable application
        shell: cmd
        run: scripts\build_app.bat --no-pause
      - name: Smoke test frozen EXE and Ghostscript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'multifora-build-smoke.json'
          $env:MULTIFORA_SMOKE_REPORT = $report
          $app = Start-Process -FilePath '.\dist\Multifora\Multifora.exe' -ArgumentList '--build-smoke-test' -Wait -PassThru
          if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
          if ($app.ExitCode -ne 0) { throw "Frozen EXE failed: $($app.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok' -or -not $result.window_visible) { throw 'Main window did not initialize' }
          & '.\dist\Multifora\bin\gswin64\gswin64c.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Ghostscript did not start' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: scripts\build_installer.bat --skip-app-build
      - name: Smoke test installed application
        shell: pwsh
        run: .\scripts\verify_installer.ps1
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Publish build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Multifora-Windows-build
          path: |
            dist/installer/Multifora-Setup-*.exe
            dist/Multifora-Portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

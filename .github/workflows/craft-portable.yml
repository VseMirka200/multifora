name: Multifora Craft Portable Win64
on:
  workflow_dispatch:
  push:
    branches: [craft-portable]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
          allow-prereleases: true
          architecture: x64
      - name: Build and verify all engines
        shell: cmd
        run: scripts\build_app.bat --no-pause
      - name: Test frozen window
        shell: pwsh
        run: |
          $env:MULTIFORA_SMOKE_REPORT = Join-Path $PWD 'dist\smoke.json'
          $p = Start-Process -FilePath '.\dist\Multifora\Multifora.exe' -ArgumentList '--build-smoke-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Smoke test timed out' }
          if (Test-Path $env:MULTIFORA_SMOKE_REPORT) { Get-Content $env:MULTIFORA_SMOKE_REPORT }
          if ($p.ExitCode -ne 0) { throw 'Frozen GUI smoke failed' }
          if (-not (Test-Path $env:MULTIFORA_SMOKE_REPORT)) { throw 'Missing smoke report' }
          if ((Get-Content $env:MULTIFORA_SMOKE_REPORT -Raw | ConvertFrom-Json).status -ne 'ok') { throw 'Invalid smoke report' }
      - name: Package portable application
        run: python scripts/package_craft_portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Multifora-Craft-Portable-Win64
          path: |
            dist/Multifora-Craft-Portable-Win64.zip
            dist/Multifora-Craft-Portable-Win64.sha256
          if-no-files-found: error

# GitHub Actions are pinned to reviewed full commit SHAs.
name: Проверка качества

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    name: Проверка качества в Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Настроить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Установить зависимости для разработки
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
          python scripts/verify_build_environment.py

      - name: Проверить стиль кода
        run: python -m ruff check .

      - name: Запустить тесты
        run: python -m pytest -q

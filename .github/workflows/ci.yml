name: Проверка качества

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    name: Проверка качества в Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости для разработки
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip check
          python scripts/verify_build_environment.py

      - name: Проверить стиль кода
        run: python -m ruff check .

      - name: Запустить тесты
        run: python -m pytest -q

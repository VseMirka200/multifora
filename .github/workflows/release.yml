name: Выпуск версии

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare-release:
    name: Подготовить выпуск
    # A pull request is safe to release only after it has been merged into main.
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Получить исходный код выпуска
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Определить версию и коммит выпуска
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(sed -nE 's/^APP_VERSION = "([^"]+)"$/\1/p' app/core/app_identity.py)"
            test -n "$version"
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists. Increase APP_VERSION before merging a release PR." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Собрать версию для Windows
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}

    steps:
      - name: Получить полную историю изменений
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости для разработки и сборки
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install "PyInstaller>=6.0.0,<7"

      - name: Проверить стиль кода
        run: python -m ruff check .

      - name: Запустить тесты
        run: python -m pytest -q

      - name: Собрать приложение
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name Multifora `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --add-data "app/ui/checkbox_checked.svg;app/ui" `
            multifora_start.py
          if (Test-Path bin) {
            Copy-Item -Path bin -Destination dist/Multifora/bin -Recurse -Force
          }

      - name: Установить Inno Setup
        shell: pwsh
        run: |
          $knownPaths = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          if (-not ($knownPaths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Собрать установщик Windows
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $versionLine = Select-String -Path app/core/app_identity.py -Pattern '^APP_VERSION = "([^"]+)"$'
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          if ($tagVersion -ne $appVersion) {
            throw "Application version $appVersion does not match release tag $env:RELEASE_TAG."
          }
          cmd /c scripts\build_installer.bat --skip-app-build
          if ($LASTEXITCODE -ne 0) {
            throw "Не удалось собрать установщик."
          }

      - name: Упаковать файлы и подготовить данные выпуска
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          $archive = "dist/Multifora-$version-windows-x64.zip"
          Compress-Archive -Path dist/Multifora/* -DestinationPath $archive -Force

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "dist/Multifora-$version-windows-x64.sha256"

          $installers = @(Get-ChildItem -Path dist/installer -Filter "Multifora-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Ожидался один установщик, найдено: $($installers.Count)."
          }
          $installer = $installers[0]
          $installerChecksum = [System.IO.Path]::ChangeExtension($installer.FullName, ".sha256")
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$installerHash  $($installer.Name)" | Set-Content -Encoding ascii $installerChecksum

          $previousTag = (& git describe --tags --abbrev=0 HEAD^ 2>$null)
          if ($LASTEXITCODE -ne 0) { $previousTag = $null }
          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          $changes = @(git log $range --pretty=format:"- %s (%h)" --no-merges)
          $releaseAssets = @(
            "## Файлы для Windows"
            ""
            "- **Установщик** `Multifora-Setup-$($version.TrimStart('v')).exe` — устанавливает приложение в Windows."
            "- **Тихая установка**: `Multifora-Setup-$($version.TrimStart('v')).exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`. Может потребоваться подтверждение UAC."
            "- **Портативная версия** `Multifora-$version-windows-x64.zip` — запускается из распакованной папки без установки."
          )
          if (-not $changes) { $changes = @("- Технический релиз") }
          @(
            "# Изменения $version"
            ""
            $releaseAssets
            ""
            "Изменения после $($previousTag ?? 'начала истории'):"
            ""
            $changes
          ) | Set-Content -Encoding utf8 dist/CHANGELOG.md

      - name: Загрузить артефакты сборки
        uses: actions/upload-artifact@v7
        with:
          name: Multifora-${{ needs.prepare-release.outputs.tag }}-windows-x64
          path: |
            dist/Multifora-${{ needs.prepare-release.outputs.tag }}-windows-x64.zip
            dist/Multifora-${{ needs.prepare-release.outputs.tag }}-windows-x64.sha256
            dist/installer/Multifora-Setup-*.exe
            dist/installer/Multifora-Setup-*.sha256
            dist/CHANGELOG.md
  
  # Публикация изолирована от установки зависимостей, тестов и Windows-сборки.
  publish-release:
    name: Опубликовать выпуск
    needs: [prepare-release, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Скачать артефакты сборки
        uses: actions/download-artifact@v4
        with:
          name: Multifora-${{ needs.prepare-release.outputs.tag }}-windows-x64
          path: release-assets

      - name: Проверить контрольные суммы и опубликовать выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TARGET: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          root="release-assets"
          archive="$root/Multifora-$TAG-windows-x64.zip"
          archive_sum="$root/Multifora-$TAG-windows-x64.sha256"
          notes="$root/CHANGELOG.md"
          mapfile -t installers < <(find "$root/installer" -maxdepth 1 -type f -name 'Multifora-Setup-*.exe')
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one installer" >&2
            exit 1
          fi
          installer="${installers[0]}"
          installer_sum="${installer%.exe}.sha256"
          test -f "$archive" && test -f "$archive_sum" && test -f "$notes" && test -f "$installer_sum"
          (cd "$root" && sha256sum -c "$(basename "$archive_sum")")
          (cd "$root/installer" && sha256sum -c "$(basename "$installer_sum")")
          gh release create "$TAG" "$archive" "$archive_sum" "$installer" "$installer_sum" \
            --target "$TARGET" --title "Мультифора $TAG" --notes-file "$notes"

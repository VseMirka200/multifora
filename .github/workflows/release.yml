name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install "PyInstaller>=6.0.0,<7"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name Multifora `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --add-data "app/ui/checkbox_checked.svg;app/ui" `
            multifora_start.py
          if (Test-Path bin) {
            Copy-Item -Path bin -Destination dist/Multifora/bin -Recurse -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $knownPaths = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          if (-not ($knownPaths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $versionLine = Select-String -Path app/core/app_identity.py -Pattern '^APP_VERSION = "([^"]+)"$'
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          if ($tagVersion -ne $appVersion) {
            throw "Версия приложения $appVersion не совпадает с тегом $env:GITHUB_REF_NAME."
          }
          cmd /c scripts\build_installer.bat --skip-app-build
          if ($LASTEXITCODE -ne 0) {
            throw "Не удалось собрать установщик."
          }

      - name: Package and generate release metadata
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $archive = "dist/Multifora-$version-windows-x64.zip"
          Compress-Archive -Path dist/Multifora/* -DestinationPath $archive -Force

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "dist/Multifora-$version-windows-x64.sha256"

          $installers = @(Get-ChildItem -Path dist/installer -Filter "Multifora-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Ожидался один установщик, найдено: $($installers.Count)."
          }
          $installer = $installers[0]
          $installerChecksum = [System.IO.Path]::ChangeExtension($installer.FullName, ".sha256")
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$installerHash  $($installer.Name)" | Set-Content -Encoding ascii $installerChecksum

          $previousTag = (& git describe --tags --abbrev=0 "$version^" 2>$null)
          if ($LASTEXITCODE -ne 0) { $previousTag = $null }
          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          $changes = @(git log $range --pretty=format:"- %s (%h)" --no-merges)
          if (-not $changes) { $changes = @("- Технический релиз") }
          @(
            "# Изменения $version"
            ""
            "Изменения после $($previousTag ?? 'начала истории'):"
            ""
            $changes
          ) | Set-Content -Encoding utf8 dist/CHANGELOG.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Multifora-${{ github.ref_name }}-windows-x64
          path: |
            dist/Multifora-${{ github.ref_name }}-windows-x64.zip
            dist/Multifora-${{ github.ref_name }}-windows-x64.sha256
            dist/installer/Multifora-Setup-*.exe
            dist/installer/Multifora-Setup-*.sha256
            dist/CHANGELOG.md

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $installers = @(Get-ChildItem -Path dist/installer -Filter "Multifora-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Ожидался один установщик, найдено: $($installers.Count)."
          }
          $installer = $installers[0]
          $installerChecksum = [System.IO.Path]::ChangeExtension($installer.FullName, ".sha256")
          gh release create $version `
            "dist/Multifora-$version-windows-x64.zip" `
            "dist/Multifora-$version-windows-x64.sha256" `
            $installer.FullName `
            $installerChecksum `
            --title "Мультифора $version" `
            --notes-file dist/CHANGELOG.md

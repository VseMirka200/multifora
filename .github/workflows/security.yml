name: Проверка безопасности

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Аудит зависимостей
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Настроить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
      - name: Проверить зависимости приложения
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --requirement requirements.txt

  codeql:
    name: Анализ CodeQL для Python
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Настроить анализ CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: python
          build-mode: none
      - name: Выполнить анализ CodeQL
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4

name: Проверка безопасности

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Аудит зависимостей
    # pywin32 — рабочая зависимость, поэтому аудит выполняется в целевой ОС.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить зависимости приложения
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --requirement requirements.txt

  codeql:
    name: Анализ CodeQL для Python
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить анализ CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Выполнить анализ CodeQL
        uses: github/codeql-action/analyze@v4

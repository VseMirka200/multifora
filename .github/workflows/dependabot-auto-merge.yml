# Автоматическое слияние зависимостей временно отключено до защиты main и настройки обязательных проверок.
# Dependabot продолжает открывать предложения обновлений согласно .github/dependabot.yml.
name: Dependabot — автоматическое слияние отключено

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Подтверждение отключения
    runs-on: ubuntu-latest
    steps:
      - name: Сообщить о текущем режиме
        run: |
          echo "Автоматическое слияние Dependabot отключено."
          echo "Изменения зависимостей нужно проверять и принимать вручную."

name: Проблема производительности
description: Медленная работа, зависание или чрезмерное потребление ресурсов
title: "[Производительность]: "
labels:
  - ошибка
  - производительность
body:
  - type: input
    id: app-version
    attributes:
      label: Версия Мультифоры
      placeholder: Например, 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Система
      description: Версия Windows, процессор и объём оперативной памяти.
      placeholder: Windows 11 24H2, Ryzen 5 5600, 16 ГБ
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Операция
      options:
        - Запуск приложения
        - Добавление и отображение файлов
        - Переименование
        - Конвертация
        - Объединение
        - Сжатие
        - Удаление метаданных
        - Другое
    validations:
      required: true
  - type: input
    id: workload
    attributes:
      label: Объём задачи
      placeholder: Например, 1000 JPEG общим размером 4 ГБ
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Наблюдаемое поведение
      description: Укажите длительность, момент замедления и восстанавливается ли приложение.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Ожидаемое поведение или сравнение
      description: Как работала предыдущая версия либо какое время кажется разумным?
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: Загрузка CPU, памяти и диска, очищенный журнал и другие наблюдения.
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я проверил существующие Issues и удалил конфиденциальные данные.
          required: true
